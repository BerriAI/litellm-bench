on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Formatting (dprint)
        uses: dprint/check@v2.3
        with:
          dprint-version: 0.57.4
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-node-workspace
        with:
          build-cli: "false"
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
      - run: pnpm schema:check
      - run: pnpm bench plan --versions 1.102.0rc1 --selection all
      - name: Check shell scripts
        run: find benchmarks -name '*.sh' -print0 | xargs -0 -n1 bash -n
