on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Exact versions/tags, including RC/dev; cannot combine with backfill"
        type: string
        required: false
      backfill_months:
        description: "Stable releases from last N 30-day months; blank means latest stable"
        type: string
        required: false
      run_note:
        description: "Optional reason or context stored with every resulting record"
        type: string
        required: false
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  plan:
    name: Validate inputs and plan jobs
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_jobs: ${{ steps.plan.outputs.has_jobs }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-workspace
      - id: plan
        uses: ./.github/actions/plan-benchmarks
        with:
          versions: ${{ inputs.versions }}
          backfill_months: ${{ inputs.backfill_months }}
          default_branch: ${{ github.event.repository.default_branch }}
          order_seed: ${{ github.run_id }}
      # Save k6 before the matrix starts so cold-cache jobs do not all download it.
      - name: Warm the k6 cache
        if: steps.plan.outputs.has_jobs == 'true'
        uses: ./.github/actions/setup-k6

  benchmark:
    name: LiteLLM ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: litellm-bench-version-${{ matrix.version }}
      cancel-in-progress: true
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/benchmark-version.yml
    with:
      version: ${{ matrix.version }}
      version-plan: ${{ toJSON(matrix) }}
      run-note: ${{ inputs.run_note || '' }}
    secrets:
      LITELLM_BENCH_BOT_TOKEN: ${{ secrets.LITELLM_BENCH_BOT_TOKEN }}
