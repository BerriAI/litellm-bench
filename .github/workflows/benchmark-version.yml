on:
  workflow_call:
    inputs:
      version:
        description: LiteLLM version to benchmark
        type: string
        required: true
      version-plan:
        description: One entry from the planned version matrix, as JSON
        type: string
        required: true
      run-note:
        description: Optional context stored with the results
        type: string
        default: ""
    secrets:
      LITELLM_BENCH_BOT_TOKEN:
        required: false

permissions:
  contents: read

env:
  RESULT_ARTIFACT: benchmark-${{ inputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  run:
    name: Benchmark LiteLLM ${{ inputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    env:
      BENCHMARK_RUN_NOTE: ${{ inputs.run-note }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-workspace
      - uses: ./.github/actions/setup-benchmark-runtime
      - id: benchmark
        name: Run this version's benchmarks
        env:
          LITELLM_BENCH_HOST: ${{ runner.environment }}
          LITELLM_VERSION: ${{ inputs.version }}
          VERSION_PLAN: ${{ inputs.version-plan }}
        run: |
          pnpm bench run-version \
            --version "$LITELLM_VERSION" \
            --plan-json "$VERSION_PLAN" \
            --output data/runs/benchmark-output
      - id: upload
        name: Upload results and diagnostics
        if: ${{ !cancelled() && (steps.benchmark.outcome == 'success' || steps.benchmark.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: data/runs/benchmark-output/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish LiteLLM ${{ inputs.version }} data
    needs: run
    # The artifact also carries the summary used to count failures in the results PR body.
    if: ${{ !cancelled() && needs.run.outputs.artifact-id != '' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: litellm-bench-results-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.LITELLM_BENCH_BOT_TOKEN || github.token }}
      - uses: ./.github/actions/setup-node-workspace
      - uses: actions/download-artifact@v5
        with:
          name: ${{ env.RESULT_ARTIFACT }}
          path: collected-results
      - id: results-change
        name: Determine results change type
        run: |
          mapfile -d '' result_files < <(find collected-results -name benchmark-result.json -print0)
          if (( ${#result_files[@]} == 0 )); then
            echo "The artifact contains no benchmark results." >&2
            exit 1
          fi

          summary_file="$(find collected-results -name version-summary.json -print -quit)"
          if [[ -z "$summary_file" ]]; then
            echo "The artifact contains no version summary." >&2
            exit 1
          fi
          succeeded="$(jq '[.[] | select(.exit_code == 0)] | length' "$summary_file")"
          failed="$(jq '[.[] | select(.exit_code != 0)] | length' "$summary_file")"
          echo "succeeded=$succeeded" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo "### Benchmark results"
            echo
            echo "- Succeeded: $succeeded"
            echo "- Failed: $failed"
          } >> "$GITHUB_STEP_SUMMARY"

          result_versions="$(jq -r '.version' "${result_files[@]}" | sort -u)"
          if [[ -z "$result_versions" || "$result_versions" == *$'\n'* ]]; then
            echo "The artifact does not contain one unique benchmark version." >&2
            exit 1
          fi

          operation=Add
          while IFS= read -r -d '' record; do
            if jq -e --arg version "$result_versions" '.result.version == $version' "$record" >/dev/null; then
              operation=Update
              break
            fi
          done < <(find data/results -name '*.json' -print0)
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
      - name: Validate and ingest this version's results
        run: >-
          pnpm bench data ingest
          --input collected-results
          --data data --mode replace-benchmark-version
      - id: benchmark-job
        name: Resolve this version's benchmark job URL
        env:
          GH_TOKEN: ${{ github.token }}
          BENCHMARK_JOB_NAME: Benchmark LiteLLM ${{ inputs.version }}
        run: |
          job_url="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" |
              jq -sr --arg name "$BENCHMARK_JOB_NAME" \
                '.[].jobs[] | select(.name == $name or (.name | endswith(" / " + $name))) | .html_url'
          )"
          if [[ -z "$job_url" || "$job_url" == *$'\n'* ]]; then
            echo "Could not resolve a unique benchmark job URL for $BENCHMARK_JOB_NAME." >&2
            exit 1
          fi
          echo "url=$job_url" >> "$GITHUB_OUTPUT"
      - name: Create or update the version's results pull request
        uses: peter-evans/create-pull-request@c0f553fe549906ede9cf27b5156039d195d2ece0
        with:
          token: ${{ secrets.LITELLM_BENCH_BOT_TOKEN || github.token }}
          base: ${{ github.event.repository.default_branch }}
          branch: bench-results-${{ inputs.version }}
          add-paths: data/
          commit-message: "data(${{ inputs.version }}): ${{ steps.results-change.outputs.operation }}"
          title: "data(${{ inputs.version }}): ${{ steps.results-change.outputs.operation }}"
          body: |
            Automated benchmark evidence generated by the committed harness.

            - LiteLLM version: `${{ inputs.version }}`
            - Benchmarks succeeded: ${{ steps.results-change.outputs.succeeded }}
            - Benchmarks failed: ${{ steps.results-change.outputs.failed }}
            - Benchmark job: ${{ steps.benchmark-job.outputs.url }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Each LiteLLM version runs on its own Ubuntu VM. Benchmarks within that
            version run sequentially. Reruns update this version's branch and PR,
            replacing the latest result for each benchmark. Failed benchmarks are
            reported above and stored as `status: failed` records without metrics, so
            the dashboard shows the failure instead of a silently missing version.
