on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [
      "data/**",
      "web/**",
      "packages/**",
      "tsconfig.base.json",
      "pnpm-lock.yaml",
      "pnpm-workspace.yaml",
      ".github/workflows/pages.yml",
      ".github/actions/setup-node-workspace/**",
      "package.json",
    ]

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: ./.github/actions/setup-node-workspace
        with:
          build-cli: "false"
      - run: pnpm --filter '@litellm-bench/web...' build
        env:
          BENCHMARK_SITE_DIR: ../site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
