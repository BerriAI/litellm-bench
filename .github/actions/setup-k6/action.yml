name: Set up k6
description: Restore or install the pinned k6 release used by the benchmarks

inputs:
  k6-version:
    description: Exact k6 version to install
    required: false
    default: "2.2.0"

runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: echo "bin_dir=${{ runner.tool_cache }}/litellm-bench/k6/${{ inputs.k6-version }}/${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"

    - id: cache
      name: Restore k6
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.bin_dir }}
        key: litellm-bench-k6-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.k6-version }}

    - name: Install k6
      if: steps.cache.outputs.cache-hit != 'true'
      # v1.2.1; pin third-party executable code to the release commit.
      uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065
      with:
        k6-version: ${{ inputs.k6-version }}

    - name: Populate k6 cache
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        K6_CACHE_DIR: ${{ steps.paths.outputs.bin_dir }}
      run: |
        mkdir -p "$K6_CACHE_DIR"
        install -m 0755 "$(command -v k6)" "$K6_CACHE_DIR/k6"

    - name: Add cached k6 to PATH
      shell: bash
      env:
        K6_CACHE_DIR: ${{ steps.paths.outputs.bin_dir }}
      run: |
        test -x "$K6_CACHE_DIR/k6"
        echo "$K6_CACHE_DIR" >> "$GITHUB_PATH"
        "$K6_CACHE_DIR/k6" version
