name: Set up Node workspace
description: Install the Node workspace and optionally build the benchmark CLI

inputs:
  build-cli:
    description: Build the benchmark CLI and its workspace dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - id: dist
      name: Restore built CLI
      if: inputs.build-cli == 'true'
      uses: actions/cache@v6
      with:
        path: |
          apps/*/dist
          packages/*/dist
          benchmarks/*/dist
        key: litellm-bench-cli-dist-v2-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.base.json', 'apps/**', 'packages/**', 'benchmarks/**', '!**/node_modules/**', '!**/dist/**') }}
    - uses: pnpm/action-setup@v6
      with:
        run_install: false
    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: pnpm
    - shell: bash
      run: pnpm install --frozen-lockfile
    - shell: bash
      if: inputs.build-cli == 'true' && steps.dist.outputs.cache-hit != 'true'
      run: pnpm --filter @litellm-bench/cli... build
